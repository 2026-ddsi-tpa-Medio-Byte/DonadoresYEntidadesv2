spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driverClassName=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

server.port=${PORT:8080}
server.address=0.0.0.0

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

springdoc.swagger-ui.path=/swagger-ui.html

donaciones.url=${DONACIONES_URL:http://localhost:8081}
incentivos.url=${INCENTIVOS_URL:http://localhost:8083}
logistica.url=${LOGISTICA_URL:http://localhost:8082}

# ── Métricas Datadog ──────────────────────────────────────
management.datadog.metrics.export.api-key=${DATADOG_API_KEY:local-no-key}
management.datadog.metrics.export.application-key=${DATADOG_APP_KEY:local-app-key}
management.datadog.metrics.export.uri=https://api.us5.datadoghq.com
management.datadog.metrics.export.step=10s
management.datadog.metrics.export.enabled=true
management.metrics.tags.app=donadores-y-entidades
management.metrics.tags.env=${APP_ENV:local}
# ── Logs centralizados en Datadog ─────────────────────────────────────────────
# Reutiliza la misma API key que las métricas: logs y métricas quedan en el mismo
# lugar y se pueden correlacionar por el tag "service".
datadog.logs.api-key=${DATADOG_API_KEY:}
datadog.logs.sitio=${DATADOG_SITE:us5.datadoghq.com}
datadog.logs.ambiente=${APP_ENV:local}

# ── Eventos para el Servicio de Consultas (Entrega 6, CQRS) ───────────────────
# Formato amqps://usuario:password@host/vhost, el mismo broker que usa Logística. Las credenciales
# van solo en la variable de entorno de Render. Sin ella, el publicador queda deshabilitado y no se
# intenta conectar (local y tests).
spring.rabbitmq.addresses=${RABBITMQ_URL:}
# Si el broker no contesta, la operación espera hasta esto antes de seguir sin publicar: corto,
# para no acercarse a los 25 s con los que el MCP corta cada pedido.
spring.rabbitmq.connection-timeout=3s
# Sin esto, un RabbitMQ caído pondría DOWN la salud de todo el módulo, que sigue funcionando: los
# eventos son best-effort y se recuperan con POST /admin/republicar-eventos.
management.health.rabbit.enabled=false

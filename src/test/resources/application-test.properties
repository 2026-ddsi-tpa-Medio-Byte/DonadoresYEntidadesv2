# Perfil "test": H2 en memoria para tests de integración (no afecta produccion/Render)
spring.datasource.url=jdbc:h2:mem:donadores;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Sin export a Datadog durante los tests
management.datadog.metrics.export.enabled=false

# Sin RabbitMQ aunque la máquina tenga RABBITMQ_URL: un test nunca puede publicar en el exchange
# real, porque Consultas cargaría los datos de prueba en el modelo de lectura. Los tests que
# necesitan el publicador lo habilitan con una dirección propia y un RabbitTemplate simulado.
spring.rabbitmq.addresses=
